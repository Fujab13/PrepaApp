<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- PrepaApp SVG Icon: Simplificación Algebraica -->
  
  <!-- Paréntesis izquierdo (Márgenes algebraicos) -->
  <path d="M 96,120 C 48,190 48,322 96,392" 
        fill="none" 
        stroke="#7c5cbf" 
        stroke-width="22" 
        stroke-linecap="round" />

  <!-- Paréntesis derecho -->
  <path d="M 416,120 C 464,190 464,322 416,392" 
        fill="none" 
        stroke="#7c5cbf" 
        stroke-width="22" 
        stroke-linecap="round" />

  <!-- SECCIÓN IZQUIERDA: Expresión compleja / Múltiples términos -->
  <g id="expresion-compleja">
    <!-- Término superior (Bloque de variable) -->
    <rect x="135" y="145" width="48" height="40" rx="12" fill="#06b6d4" />
    <circle cx="168" cy="158" r="5" fill="#f0f0f0" />

    <!-- Operador suma (+) -->
    <path d="M 205,155 V 175 M 195,165 H 215" 
          stroke="#7c5cbf" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Estructura de Fracción algebraíca -->
    <!-- Numerador -->
    <circle cx="159" cy="225" r="18" fill="#cf3b3b" />
    <!-- Barra de fracción -->
    <line x1="135" y1="256" x2="183" y2="256" 
          stroke="#f0f0f0" 
          stroke-width="6" 
          stroke-linecap="round" />
    <!-- Denominador -->
    <rect x="137" y="272" width="44" height="36" rx="10" fill="#06b6d4" />

    <!-- Operador de separación -->
    <circle cx="205" cy="256" r="4" fill="#7c5cbf" />

    <!-- Término inferior -->
    <rect x="135" y="325" width="56" height="40" rx="12" fill="#cf3b3b" />
  </g>

  <!-- SECCIÓN CENTRAL: Embudo / Flecha de Simplificación -->
  <g id="flecha-simplificacion">
    <!-- Guías punteadas de reducción/convergencia -->
    <path d="M 225,170 Q 260,210 270,230" 
          fill="none" 
          stroke="#7c5cbf" 
          stroke-width="4" 
          stroke-dasharray="6 6" 
          stroke-linecap="round" 
          opacity="0.8" />
    <path d="M 225,342 Q 260,302 270,282" 
          fill="none" 
          stroke="#7c5cbf" 
          stroke-width="4" 
          stroke-dasharray="6 6" 
          stroke-linecap="round" 
          opacity="0.8" />

    <!-- Flecha principal de transformación -->
    <path d="M 235,256 H 290" 
          fill="none" 
          stroke="#06b6d4" 
          stroke-width="10" 
          stroke-linecap="round" />
    <path d="M 278,242 L 298,256 L 278,270" 
          fill="none" 
          stroke="#06b6d4" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- SECCIÓN DERECHA: Término simplificado / Resultado final -->
  <g id="resultado-simplificado">
    <!-- Gem/Gema simplificada (Rombo redondeado) -->
    <g transform="translate(352, 256) rotate(45)">
      <rect x="-32" y="-32" width="64" height="64" rx="18" fill="#cf3b3b" />
      <circle cx="0" cy="0" r="14" fill="#f0f0f0" />
    </g>

    <!-- Destello superior (Éxito / Claridad) -->
    <path d="M 380,188 C 380,196 384,200 392,200 C 384,200 380,204 380,212 C 380,204 376,200 368,200 C 376,200 380,196 380,188 Z" 
          fill="#06b6d4" />

    <!-- Destello secundario inferior -->
    <path d="M 370,314 C 370,319 373,322 378,322 C 373,322 370,325 370,330 C 370,325 367,322 362,322 C 367,322 370,319 370,314 Z" 
          fill="#7c5cbf" />
  </g>
</svg>
